name: Release desktop

# Push a tag like `desktop-v0.1.0` and this builds the desktop app for macOS
# (Apple Silicon and Intel), Windows and Linux, and attaches the installers to
# a GitHub release of that tag. The version in the installers' names comes from
# `apps/desktop/src-tauri/tauri.conf.json`, so bump it there first.
#
# macOS builds are signed with the Developer ID certificate and notarized by
# Apple when the repository variable MACOS_SIGNING is `on` and these secrets
# are set. Otherwise the build is unsigned, like v0.1.0 — a notarization login
# that Apple refuses fails the whole macOS job, so signing is switched on only
# once the secrets are known to work:
#
#   APPLE_CERTIFICATE           the Developer ID Application .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  the password the .p12 was exported with
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <name> (<team id>)"
#   APPLE_ID                    the Apple Developer account's email
#   APPLE_PASSWORD              an app-specific password for that Apple ID
#   APPLE_TEAM_ID               the team id
#
# Windows builds are not signed; SmartScreen warns once.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. desktop-v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: ''
          - name: Linux
            os: ubuntu-22.04
            target: ''
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && vars.MACOS_SIGNING == 'on' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Only on macOS, and only when the certificate is there: an empty
      # APPLE_CERTIFICATE makes the bundler try to import nothing and fail.
      - name: Apple signing and notarization
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$ID"
            echo "APPLE_PASSWORD=$PASSWORD"
            echo "APPLE_TEAM_ID=$TEAM"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'JOYGOTCHI Desktop v__VERSION__'
          releaseBody: |
            A small transparent window that sits above your editor. Your pet idles there and animates on every tool call your coding agent makes.

            **Pick your download**
            - macOS, Apple Silicon (M1 and later): `JOYGOTCHI_<version>_aarch64.dmg`
            - macOS, Intel: `JOYGOTCHI_<version>_x64.dmg`
            - Windows: `JOYGOTCHI_<version>_x64-setup.exe`
            - Linux: `.AppImage`, `.deb` or `.rpm`

            These builds are not code-signed yet.
            - **macOS** says the app "is damaged" or "can't be opened". Drag it to Applications, then run `xattr -dr com.apple.quarantine /Applications/JOYGOTCHI.app` once.
            - **Windows** SmartScreen: click *More info* → *Run anyway*.

            Then install a pet from https://joygotchi.vercel.app and connect your agent from the app's Settings.
          releaseDraft: false
          prerelease: false
